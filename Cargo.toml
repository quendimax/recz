[workspace]
members = [
    "recz",
    "recz-adt",
    "recz-bench",
    "recz-cli",
    "recz-codec",
    "recz-codegen",
    "recz-graph",
    "recz-macro",
    "recz-syntax",
]
default-members = [
    "recz",
    "recz-adt",
    "recz-codec",
    "recz-codegen",
    "recz-graph",
    "recz-macro",
    "recz-syntax",
]
resolver = "3"

[workspace.package]
authors = ["Maksim Tomkavich <quendimax@gmail.com>"]
edition = "2024"
repository = "https://github.com/quendimax/recz"

[workspace.dependencies]
ahash = "0.8"
arrayvec = "0.7.6"
bumpish = { git = "https://codeberg.org/quendimax/bumpish.git"}
clap = "4.6"
miette = "7"
ntest = "0.9"
num-traits = "0.2"
owo-colors = "4"
paste = "1"
pretty_assertions = "1"
prettyplease = "0.2"
proc-macro2 = "1"
proptest = "1"
quote = "1"
regex-syntax = "0.8.5"
smallvec = "1"
syn = "2"
test-case = "3.3"
thiserror = "2"

[profile.dev]
debug = false

[profile.bench]
debug = true
strip = false
